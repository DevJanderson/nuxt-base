name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lê a versão do pnpm do campo "packageManager" do package.json
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - run: pnpm install

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
