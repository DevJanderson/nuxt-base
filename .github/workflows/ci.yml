name: ci

on:
  push:
    branches: [main]
  pull_request:

# Fuso explícito: teste sensível a data deve falhar igual aqui e em produção,
# não passar no seu fuso local e quebrar no do runner (aprendido no nuxt-kit)
env:
  TZ: UTC

jobs:
  ci:
    runs-on: ubuntu-latest
    # O smoke sobe servidores; rota pendurada não pode segurar o runner até o limite dele
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Lê a versão do pnpm do campo "packageManager" do package.json
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # --frozen-lockfile já é default em CI; explícito para falhar alto e
      # documentado quando o lockfile estiver fora de sincronia com o package.json
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm dup
      - run: pnpm test
      # Substitui o `pnpm build`: o smoke já builda e ainda sobe o app
      # (produção e dev), requisita as rotas e reprova log sujo.
      - run: pnpm smoke

  gitleaks:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: o gitleaks varre o histórico, não só o snapshot
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v3 = runtime Node 24 (v2 morre em 16/09/2026 com a remoção do Node 20).
      # Licença: gratuito para conta pessoal; organização exige GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
